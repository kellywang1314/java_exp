spring.application.name=java-exp
server.port=8082

spring.datasource.url=jdbc:h2:mem:java_exp;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.cache.type=simple
spring.cache.cache-names=products
spring.data.redis.repositories.enabled=false
spring.data.elasticsearch.repositories.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info,metrics,caches
management.health.redis.enabled=false
management.health.elasticsearch.enabled=false
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Spring Boot product API learning project
info.app.java.version=${java.version}

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n
